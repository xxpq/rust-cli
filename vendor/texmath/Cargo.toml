# TeX 数学子集的 Unicode 排版（上游 openai/codex 的 codex-rs/tui/src/markdown_render/math/render.rs 与 render/structured.rs，
# 提交 c3d3b142d，Apache-2.0）：kit 的 Markdown 用它排公式（docs/specs/rust-cli/tui-kit.md §3.5）。
# 第三方代码：不是 workspace 成员（根 Cargo.toml 的 workspace.exclude），不受本工程的 lints 与 clippy.toml 约束；
# upstream/ 下的文件由 scripts/rust-cli/vendor/fetch.mjs 按 vendor/sources.json 生成，不手改。lib.rs 是本工程写的一层：
# 给出上游要的 `crate::width` 与对外的 `render`。依赖同上游，版本由 workspace 的 Cargo.lock 决定。
[package]
name = "rust-cli-vendor-texmath"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "lib.rs"
doctest = false
test = false

[dependencies]
unicode-segmentation = "1.13"
unicode-width = "0.2"
