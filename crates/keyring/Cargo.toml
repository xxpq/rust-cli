[package]
name = "rust-cli-keyring"
description = "The single entry point for the system credential store (macOS Keychain, Windows Credential Manager, Linux Secret Service) in rust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
# 凭据库的调用都是阻塞的（macOS 可能等用户回答系统弹框），经 base 的 `blocking`（docs/specs/rust-cli/platform.md §13.3）。
rust-cli-base.workspace = true
thiserror.workspace = true
# 与 Node 的 `@napi-rs/keyring` 2.1.2 同源的 keyring 库（README §3.2.1）：条目的名字、编码与错误都由各平台的 store 定。
keyring-core = "1.0.1"

# macOS：用户域缺省钥匙串里的通用密码（store 的 `keychain` 特性，Node 用的就是它）。
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

# Windows：凭据管理器的通用凭据。不要缺省的 `search`（按正则列条目，本工程不用）。
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

# Linux：Secret Service。Node 用 dbus 版（libdbus），这里用同一作者逐行移植的 zbus 版：条目与搜索规则相同，纯 Rust，
# musl 静态链接不要 libdbus；会话加密 dh-ietf1024（`crypto-rust`），zbus 跑在 tokio 上（与原来的 secret-service 特性相同）。
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["rt-tokio-crypto-rust"] }

# 手动核对的辅助程序（examples/keyring_probe.rs，platform.md §13.10）。
[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

# 辅助程序在 macOS 上先关掉钥匙串的用户交互（要弹框的访问报错，不在桌面上弹框）。
[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework = "3"
