[package]
name = "rust-cli-request-security-edition"
description = "The request handling of this edition, injected into the model port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

# 导出到 ZCode-rs 时 src 整目录换成占位，这份清单两边共用（docs/specs/rust-cli/export.md §12）：依赖相同，锁文件不变。
[dependencies]
async-trait.workspace = true
base64.workspace = true
# 一次准备请求由同时到的请求共用（Shared，不起任务）。
futures-util.workspace = true
# 密码学原语与随机串（与 rustls、platform 共用同一个 ring）。
ring.workspace = true
rust-cli-base.workspace = true
rust-cli-kernel-api.workspace = true
rust-cli-model.workspace = true
rust-cli-net.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# 共用的测试时钟（kernel-api 的 testing，F126）。
rust-cli-kernel-api = { workspace = true, features = ["testing"] }
# net：测试搭本地 HTTP 夹具（README §4）。
tokio = { workspace = true, features = ["macros", "net", "rt"] }
