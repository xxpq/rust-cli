[package]
name = "rust-cli-base"
description = "Task supervision, secrets, redaction and JavaScript-semantics text helpers for rust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# 读对照夹具（tests/parity/frontmatter）的单测，只在本仓库（docs/specs/rust-cli/export.md §5）。
parity = []

[dependencies]
futures-util.workspace = true
# JS 的 encodeURIComponent / decodeURIComponent（`js::uri`，README §3.2.1）。
percent-encoding.workspace = true
regex.workspace = true
# Markdown frontmatter 的 YAML（`frontmatter`，README §3.2.1）。
saphyr.workspace = true
saphyr-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
# 字节的 sha256 写成 hex（`hash::sha256_hex`，F128）。
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
