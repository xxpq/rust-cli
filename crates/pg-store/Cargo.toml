[package]
name = "rust-cli-pg-store"
description = "Tenant-bound PostgreSQL session storage for rust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
testing = []

[dependencies]
async-trait.workspace = true
rust-cli-base.workspace = true
rust-cli-kernel-api.workspace = true
rust-cli-node-records.workspace = true
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
sea-orm.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net"] }
rust-cli-kernel-api = { workspace = true, features = ["testing"] }
