[package]
name = "rust-cli-kernel-api"
description = "Ports and shared types of the rust-cli kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
# 工具路径参数的 NFC（env_path::nfc，tools-files.md §3.2）。
icu_normalizer.workspace = true
# 跨会话地址的百分号编码（`peers::PeerAddress`，cross-session.md §1.4）。
percent-encoding.workspace = true
# 权限规则的通配（`permission::syntax`，shell-permissions.md §4.2）。
regex.workspace = true
# MCP 表单的 email、date 校验（`mcp_ask`，ext.md §3.13.3）：照 zod 4 的正则原文，带先行断言，要 JS 语义的引擎。
regress.workspace = true
rust-cli-base.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
# MCP 表单的 uri 校验（`mcp_ask`，ext.md §3.13.3）：同 zod 4 的 `new URL()`，WHATWG URL。
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[features]
# 测试用的假端口（testing 模块）；只在其他 crate 的 dev-dependencies 里打开。tokio 的时间给 testing 的 TokioClock。
testing = ["tokio/time"]
# 读对照夹具（tests/parity/uri）的单测，只在本仓库（docs/specs/rust-cli/export.md §5）。
parity = []
