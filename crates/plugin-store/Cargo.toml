[package]
name = "rust-cli-plugin-store"
description = "The plugin store of rust-cli: marketplaces, installs and plugin settings shared with the Node CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
rust-cli-base.workspace = true
# 存储根下的文件、锁、暂存与改名（docs/specs/rust-cli/plugin-store.md §3、§4）。
rust-cli-fs.workspace = true
# 市场清单、zip 与 GitHub Archive 的下载经入口的同一个出口（plugin-store.md §9.4）。
rust-cli-net.workspace = true
# 系统 git（plugin-store.md §9.4）。
rust-cli-proc.workspace = true
rust-cli-paths.workspace = true
# 工作区键的路径规范化（`PathStyle`，ext.md §4.12）。
rust-cli-kernel-api.workspace = true
async-trait.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
# 取消（plugin-store.md §12）。
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
# zip 的读法：解进内存，写文件经 fs（README §3.2.1）。只开 deflate。
zip = { workspace = true }
# 不直接用：给 zip 的 deflate 选 flate2 的缺省后端（rust_backend），与 cli 解 gzip 同一个；zip 自己不选后端，单独编这个
# crate 时没有它就编不过。
flate2.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "io-util"] }
