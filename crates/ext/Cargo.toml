[package]
name = "rust-cli-ext"
description = "Skills, MCP semantics and plugins of rust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
# `roots/list` 的 file URI 的百分号编码（ext.md §3.2）。
percent-encoding.workspace = true
regex.workspace = true
rmcp.workspace = true
rust-cli-base.workspace = true
rust-cli-kernel-api.workspace = true
rust-cli-prompts.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[features]
# 读对照夹具（tests/parity/uri）的单测，只在本仓库（docs/specs/rust-cli/export.md §5）。
parity = []

[dev-dependencies]
rust-cli-kernel-api = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
